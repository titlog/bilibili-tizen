<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- bilibili 403s a Referer it does not recognise but accepts none at all,
         and WebKit would otherwise attach the widget's own file:// origin. -->
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=1920, height=1080">
    <title>bilibili</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/legacy-layout.css">
</head>
<body>

<!-- AVPlay draws in a hardware plane underneath the DOM, so everything else
     lives in a layer above it and is hidden while playing. -->
<div id="video-stage"></div>
<video id="html5-video" class="hidden" width="1920" height="1080"></video>

<div id="shell">

    <header id="topbar">
        <div class="brand">bilibili</div>
        <!-- Wider than the bar once 直播 and the chosen zones are in (2026-10-18):
             "hscroll" makes nav.js slide the row to keep the focused tab in view. -->
        <nav id="tabs" class="hscroll">
            <div class="tab focusable" data-screen="rcmd">推荐</div>
            <!-- Everything between 推荐 and 搜索 is the viewer's choice (设置 → 顶栏,
                 2026-10-18), built by app.js renderUserTabs: 直播 动态 我的 稍后 热门
                 排行 美食 舞蹈 until somebody changes it. -->
            <div class="tab focusable" data-screen="search">搜索</div>
            <div class="tab focusable" data-screen="settings">设置</div>
        </nav>
        <!-- Who the set is currently signed in as. Right of the tabs, so the
             remote reaches it by pressing right past the last of them. -->
        <div id="account" class="focusable">
            <span id="account-initial">客</span>
            <img id="account-face" class="hidden" alt="">
            <span id="account-name">未登录</span>
        </div>
        <div id="status"></div>
    </header>

    <main id="screen" class="scroll"></main>

</div>

<div id="player-loading" class="hidden">
    <div class="spinner"></div>
    <div id="loading-title"></div>
    <div id="loading-status"></div>
</div>

<div id="pause-glyph" class="hidden"><div class="bar"></div><div class="bar"></div></div>
<!-- 弹幕 (danmaku.js): under the subtitles and the player chrome, by document order. -->
<div id="danmaku" class="hidden"></div>
<div id="subtitle-overlay" class="hidden"><div id="subtitle-text"></div></div>

<div id="playerui" class="hidden">
    <div id="player-part"></div>
    <div id="player-title"></div>
    <div id="player-bar">
        <span id="player-pos">0:00</span>
        <div id="player-track">
            <div id="player-buffer"></div>
            <div id="player-fill"></div>
            <div id="player-chapters"></div>
            <div id="player-scrub" class="hidden"></div>
            <!-- Where the scrub head is pointing, as a picture. Guessing from a
                 timestamp is the slow half of crossing a long video. -->
            <div id="scrub-preview" class="hidden">
                <div id="scrub-thumb"></div>
                <div id="scrub-chapter"></div>
            </div>
        </div>
        <span id="player-dur">0:00</span>
        <span id="player-quality"></span>
    </div>
    <div id="player-hint">确认键 播放/暂停 &middot; 左右 快退/快进 &middot; 下键 简介/相关 &middot; 返回键 退出</div>
</div>

<!-- 直播 (2026-10-18): its own banner, not #playerui — there is no position,
     no progress bar and no scrubbing, and the on-demand banner's show/hide
     logic is keyed on the on-demand session. -->
<div id="live-ui" class="hidden">
    <div id="live-top"><span id="live-badge">直播</span><span id="live-meta"></span></div>
    <div id="live-title"></div>
    <div id="live-hint"></div>
</div>

<div id="options" class="hidden scroll">
    <div id="panel-head">
        <div id="panel-title"></div>
        <div id="panel-meta"></div>
        <div id="panel-desc"></div>
        <!-- One row (2026-10-20, the viewer's layout): 弹幕 on/off, then the
             three buttons as on the web page — 点赞 toggles, 投币 and 收藏 open
             their choice in the row under them, not in a popup — 看评论, and the
             speed chips. -->
        <div class="actions" id="panel-actions">
            <div class="btn ghost focusable act" id="panel-dm">弹幕</div>
            <div class="btn ghost focusable act" id="panel-like">点赞</div>
            <div class="btn ghost focusable act" id="panel-coin">投币</div>
            <div class="btn ghost focusable act" id="panel-fav">收藏</div>
            <div class="btn ghost focusable" id="panel-comments">看评论</div>
            <div class="speed-row"><span class="act-hint">倍速</span><div class="speed-chips" id="opt-speed"></div></div>
        </div>
        <div class="act-more hidden" id="panel-act-more"></div>
    </div>
    <!-- 上一集 / 下一集 (PR #9): the parts first, then the 合集. -->
    <div class="opt-group hidden" id="opt-episode-controls">
        <div class="actions">
            <div class="btn ghost focusable hidden" id="panel-prev-episode">上一集</div>
            <div class="btn ghost focusable hidden" id="panel-next-episode">下一集</div>
        </div>
    </div>
    <div class="opt-group" id="opt-dm-area-group">
        <div class="opt-label">弹幕位置（全局）</div>
        <div class="opt-row" id="opt-dm-area">
            <div class="opt focusable" data-area="top">顶部 1/4</div>
            <div class="opt focusable" data-area="upper">避开底部 1/4</div>
            <div class="opt focusable" data-area="full">全屏</div>
        </div>
    </div>
    <div class="opt-group" id="opt-parts-group">
        <div class="opt-label">分P</div>
        <div class="opt-row" id="opt-parts"></div>
    </div>
    <!-- 合集 (2026-10-18): the uploader's series this video belongs to. Hidden
         unless view() says there is one. -->
    <div class="opt-group hidden" id="opt-season-group">
        <div class="opt-label" id="opt-season-label">合集</div>
        <div class="opt-row" id="opt-season"></div>
    </div>
    <div class="opt-group" id="opt-related-group">
        <div class="opt-label">相关推荐</div>
        <div id="opt-related"></div>
    </div>
</div>

<div id="comments-view" class="hidden">
    <div id="comments-video-meta">
        <div id="comments-video-title"></div>
        <div id="comments-video-hint">视频继续播放中 · 播放/暂停键控制视频 · 返回键关闭评论</div>
    </div>
    <div id="comments-pane">
        <div id="comments-head">
            <div id="comments-title">评论</div>
            <div id="comments-level"></div>
        </div>
        <div id="comments-hint">上下浏览 · 右键看楼中楼 · 返回退出 · 评论只读</div>
        <div id="comments-list" class="scroll"></div>
        <div id="comments-status"></div>
    </div>
</div>

<div id="video-actions" class="hidden">
    <div id="video-actions-box" class="scroll"></div>
</div>

<!-- The end of a video is a decision, not a notice: carry on with what is
     queued, or pick something else. So the queued one sits in the middle where
     the picture just was, and what else there is sits under it — reachable by
     pressing down, which also stops the countdown.

     "Under it" is a grid you can keep walking down, not a single row: this is
     the moment the viewer is most likely to be choosing rather than continuing,
     and one row of cards is a glance, not a choice. `scroll` is what nav.js
     looks for to move the screen when the focus goes below the fold — any code
     that rewrites this className has to keep it. -->
<div id="nextup" class="hidden scroll">
    <div class="nextup-main">
        <div class="nextup-label">即将播放</div>
        <!-- The queued card and, to its right, the uploader of the video that
             just ended. Right rather than under: 下键 from the card has to keep
             landing in the related grid. Hidden unless the finished video knew
             its uploader's mid. -->
        <div class="nextup-row">
            <div class="nextup-card focusable" id="nextup-go">
                <img id="nextup-thumb" class="hidden" alt="">
                <div class="nextup-title" id="nextup-title"></div>
            </div>
            <div class="nextup-up hidden" id="nextup-up">
                <img id="nextup-up-face" class="hidden" alt="">
                <span id="nextup-up-initial" class="hidden"></span>
                <div class="nextup-up-name" id="nextup-up-name"></div>
                <div class="nextup-up-sub">看这位 UP 主的全部投稿</div>
            </div>
        </div>
        <div class="nextup-hint" id="nextup-hint"><span id="nextup-count">8</span> 秒后开始 &middot; 确认键 立即播放 &middot; 返回键 退出</div>
    </div>
    <div class="nextup-more hidden" id="nextup-more">
        <div class="section">相关推荐</div>
        <div id="nextup-related"></div>
    </div>
</div>

<div id="ime-wrap" class="hidden">
    <input id="ime" type="text" autocomplete="off" placeholder="输入关键词">
    <div id="ime-hint">用电视键盘输入 &middot; 完成后按确认键搜索 &middot; 返回键取消</div>
</div>

<div id="toast" class="hidden"></div>

<!-- Shaka does the DASH. This replaced a hand-rolled MSE byte pump that had to
     parse the segment index, size its own requests, evict its own buffer and
     abort its own fetches on a seek — every one of which was a bug at some
     point. The pre-compiled build is ES5 and needs no bundler. -->
<!-- vendor/shaka-player.compiled.js is not loaded here: player.js injects it
     after the first screen (withShakaScript). It was 322ms of the 756ms to
     onload, parsed ahead of a screen that never uses it. -->

<!-- Two tags only. boot.js writes the rest — the package's own scripts, or a
     newer verified version self-update downloaded (its SCRIPTS list is the load
     order now; add new files there, not here). config.js stays outside: deploy.sh
     rewrites it, and an update must never carry it. -->
<script src="js/config.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
