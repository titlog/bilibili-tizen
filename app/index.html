<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- bilibili 403s a Referer it does not recognise but accepts none at all,
         and WebKit would otherwise attach the widget's own file:// origin. -->
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=1920, height=1080">
    <title>bilibili</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- AVPlay draws in a hardware plane underneath the DOM, so everything else
     lives in a layer above it and is hidden while playing. -->
<div id="video-stage"></div>
<video id="html5-video" class="hidden" width="1920" height="1080"></video>

<div id="shell">

    <header id="topbar">
        <div class="brand">bilibili</div>
        <nav id="tabs">
            <div class="tab focusable" data-screen="rcmd">推荐</div>
            <div class="tab focusable" data-screen="popular">热门</div>
            <div class="tab focusable" data-screen="ranking">排行</div>
            <div class="tab focusable" data-screen="dynamic">动态</div>
            <div class="tab focusable" data-screen="search">搜索</div>
            <div class="tab focusable" data-screen="mine">我的</div>
        </nav>
        <div id="status"></div>
    </header>

    <main id="screen" class="scroll"></main>

</div>

<div id="playerui" class="hidden">
    <div id="player-title"></div>
    <div id="player-bar">
        <span id="player-pos">0:00</span>
        <div id="player-track"><div id="player-fill"></div></div>
        <span id="player-dur">0:00</span>
    </div>
    <div id="player-hint">确认键 播放/暂停 &middot; 左右 快退/快进 &middot; 返回键 退出</div>
</div>

<div id="nextup" class="hidden">
    <div class="nextup-label">即将播放</div>
    <div class="nextup-title" id="nextup-title"></div>
    <div class="nextup-hint"><span id="nextup-count">5</span> 秒后开始 &middot; 确认键 立即播放 &middot; 返回键 取消</div>
</div>

<input id="ime" type="text" autocomplete="off">

<div id="toast" class="hidden"></div>

<script src="js/config.js"></script>
<script src="js/qr.js"></script>
<script src="js/auth.js"></script>
<script src="js/resume.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
