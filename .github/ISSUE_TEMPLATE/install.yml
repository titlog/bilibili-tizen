name: Install / certificate problem / 安装或证书问题
description: Cannot sign, cannot install, cannot connect / 签不出来、装不上、连不上
labels: [install]
body:
  - type: markdown
    attributes:
      value: |
        Four failures account for almost all of these, and each one looks like
        something else. Check them first — it is faster than waiting for a reply.

        以下四种占了绝大多数，而且每一种看起来都像别的问题。先自查，比等回复快：

        | Symptom / 症状 | Cause / 原因 |
        |---|---|
        | `Invalid certificate chain` | Tizen's own distributor certificates do not work on 2023+ sets — **both** of them, expired and `-new` alike. You need a Samsung-issued one. / Tizen 自带的两套分发证书在新机器上都不行，必须用三星签发的 |
        | Installs, but the app is not there / 装完了但找不到应用 | The distributor certificate was issued for a different DUID / 分发证书绑的是别的 DUID |
        | `sdb` times out silently / `sdb` 静默超时 | Developer Mode lists a different host PC address, or the TV was not fully power-cycled after changing it / 开发者模式里登记的主机地址不是这台，或者改完没有完整断电重启 |
        | Nothing in the collector / 收集器一片空白 | It was started after the app. The app gives up reporting after five failures / 收集器开晚了。应用连撞五次失败会永久关闭上报 |

  - type: dropdown
    id: step
    attributes:
      label: Which step / 卡在哪一步
      options:
        - tools/setup.sh
        - Certificate issuance / 证书签发 (samsung-tv-cert)
        - tizen package / 打包签名
        - tizen install / 安装
        - sdb connect / 连接电视
        - The app is installed but misbehaves at launch / 装上了但启动就不对
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: TV model and year / 电视型号和年份
      placeholder: UE65CU7090, 2023
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Full command and output / 完整的命令和输出
      description: |
        The whole thing, not the last line. **Remove your DUID and any
        certificate password before pasting.**

        整段贴，不要只贴最后一行。**贴之前把 DUID 和证书密码删掉。**
      render: shell
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS, Node version, Tizen Studio version / 系统、Node 版本、Tizen Studio 版本
      placeholder: macOS 15.5, Node 22.3, Tizen Studio 5.5 CLI
